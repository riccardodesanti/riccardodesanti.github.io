{% capture preprints_html %}
  {% bibliography -f {{ site.scholar.bibliography }} --group_by none --query @*[preprint=true]* %}
{% endcapture %}
{% if preprints_html contains '<li' %}
  <h2><a href="{{ '/publications/' | relative_url }}" style="color: inherit;">Selected Pre-prints</a></h2>
  <div class="publications">
    {{ preprints_html }}
  </div>
{% endif %}
