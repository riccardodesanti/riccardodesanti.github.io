# Selected talks displayed on the About page.
#
# Each entry has:
#   date:    "YYYY-MM-DD" or "YYYY-MM"; displayed as month and year
#   date_end: (optional) end date for a grouped series spanning several months
#   year:    fallback when a date is unavailable
#   title:   talk title
#   venues:  list of institutions; each item is { name, url }. `url` is optional.
#            Venue names are rendered in italics and, when `url` is set, are
#            linked to that URL (usually the institution's homepage).
#   note:    (optional) extra plain-text context appended after the venues
#            (e.g. city/country, hosting group)
#   slides:  (optional) URL or /assets/pdf/... path; when set, the talk title
#            becomes a clickable link to the slides.
#   tag:     (optional) small plain-text tag rendered right after the last
#            venue name, e.g. "(scheduled)" for upcoming talks.
